[package]
name = "tantivy-jieba"
version = "0.17.0"
authors = ["Jiajie Chen <c@jia.je>"]
edition = "2021"
description = "A library that bridges between tantivy and jieba-rs"
repository = "https://github.com/jiegec/tantivy-jieba"
readme = "README.md"
keywords = ["tantivy", "jieba"]
license = "MIT"

[dependencies]
jieba-rs = "0.8.1"
lazy_static = "1.5.0"
#tantivy-tokenizer-api = { git = "https://github.com/datafuse-extras/tantivy", rev = "9065a4d", package="tantivy-tokenizer-api" }
tantivy-tokenizer-api = { git = "https://github.com/b41sh/tantivy", rev = "7cec26400695dc9d8299751c3b36e8b9eee6abbc", package="tantivy-tokenizer-api" }

[dev-dependencies]
tantivy = "0.26.0"
criterion = "0.8.1"

[[bench]]
name = "bench"
harness = false

